name = "buckit"
main = "src/index.js"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

[triggers]
# Every 15 min normally; every 5 min on Thursdays (buckit's weekly posting day), since the
# two triggers overlap at the :00/:15/:30/:45 marks — the 5-min one just adds finer coverage
# on the day a new post is most likely to land.
crons = ["*/15 * * * *", "*/5 * * * 4"]

# Workers Logs — retain cron/fetch logs so a failed Reddit scan can be diagnosed after the
# fact. Without this, a silent staleness incident can only be caught by a live `wrangler tail`
# running at the top of the hour. head_sampling_rate = 1 keeps every invocation: this Worker
# runs hourly plus light site traffic, so the volume is negligible.
[observability]
enabled = true
head_sampling_rate = 1

[[kv_namespaces]]
binding = "PREDICTIONS"
id = "07cd82600a824364b919db2c1cbc2663"
preview_id = "de766f929ed74e999beb5a3676bc3230"

[[r2_buckets]]
binding = "IMAGES"
bucket_name = "buckit-images"
preview_bucket_name = "buckit-images-preview"

[ai]
binding = "AI"

[vars]
SITE_URL = "https://hfxgas.ca"
REDDIT_USER_AGENT = "Buckit/1.0 (github.com/program-the-brain-not-the-heartbeat/hfxgas.ca)"
REDDIT_AUTHOR = "buckit"
REDDIT_SUBREDDIT = "halifax"
MAX_HISTORY = "10"
REDDIT_USERNAME = "mutexlabs"

# Secrets (set via: task secret)
# WEBHOOK_SECRET — required for POST /webhook and MCP write tools
# REDDIT_CLIENT_ID — optional; enables Reddit's authenticated API.
# REDDIT_CLIENT_SECRET — set for web/script apps; omit for installed apps.
#   Installed apps use the installed_client grant without a secret.
#   Without a client ID, the cron falls back to the public RSS feed.
